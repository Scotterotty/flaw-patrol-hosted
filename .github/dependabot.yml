# Weekly update pull requests, grouped so there are a few PRs a week rather than dozens.
# Security fixes come separately as soon as an advisory is published, once
# "Dependabot security updates" is on in the repo's Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates for everything, in one PR.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Big upgrades are planned builds of their own (zod 4, Next 16, Prisma 7).
      - dependency-name: zod
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # The production image's base (node:22-bookworm-slim) in Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
