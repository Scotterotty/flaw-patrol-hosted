name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Actions → CI → Run workflow, with "full" ticked, runs every end-to-end spec.
  workflow_dispatch:
    inputs:
      full:
        description: Run every end-to-end spec (about 30 minutes)
        type: boolean
        default: false

# A newer push to the same branch or PR stops the older run, so minutes aren't spent twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The full end-to-end run on `next dev` used to go on for 40+ minutes until GitHub killed it,
    # and used up the private repo's Actions minutes. Each build runs every spec locally
    # (npm run e2e:all), so CI checks the build and signs in on the production server.
    timeout-minutes: ${{ inputs.full && 70 || 25 }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testmgmt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testmgmt
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      # Seeded demo people get this password (same as tests/e2e/auth.ts PASSWORD).
      SEED_PASSWORD: flaw patrol e2e password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on a high or critical advisory in shipped packages unless it's on
      # security/audit-allowlist.json with a reason and an unexpired review date.
      - name: Vulnerability check (npm audit)
        run: npm run audit:check
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test (production server)
        if: ${{ !inputs.full }}
        run: npx playwright test tests/e2e/smoke.spec.ts
        env:
          E2E_SERVER: prod
      - name: Every end-to-end spec (production server)
        if: ${{ inputs.full }}
        run: npx playwright test --max-failures=15
        env:
          E2E_SERVER: prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
