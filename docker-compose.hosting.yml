# Flaw Patrol on a shared server behind nginx-proxy, with its own database
# (README: Host it on a server).
#   1. cp flaw-patrol.env.example flaw-patrol.env   and fill it in (stays on the server)
#   2. Change flawpatrol.magnopus.global below to the address you picked (3 spots)
#   3. docker compose -f docker-compose.hosting.yml up -d --build
# nginx-proxy must allow 210 MB uploads for this address: put
#   client_max_body_size 210m;
# in its vhost.d/flawpatrol.magnopus.global file BEFORE step 3 (or restart nginx-proxy after).
services:
  flaw-patrol:
    build: .
    image: flaw-patrol
    container_name: flaw-patrol
    restart: unless-stopped
    expose:
      - "6767"
    # Uploaded files, results and everything else are kept in the database below.
    env_file: flaw-patrol.env
    environment:
      - VIRTUAL_HOST=flawpatrol.magnopus.global
      - VIRTUAL_PORT=6767
      # If the proxy gets HTTPS certificates itself (acme-companion), keep this line.
      - LETSENCRYPT_HOST=flawpatrol.magnopus.global
      # The address people open; sign-in and invite links use it.
      - AUTH_URL=https://flawpatrol.magnopus.global
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      database:

  # Postgres for Flaw Patrol. It is not on the proxy's network; Flaw Patrol reaches it
  # inside the private network on 5432. Its data lives in the flaw-patrol-data volume,
  # which survives restarts, updates and `docker compose down` (not `down -v`).
  db:
    image: postgres:17
    container_name: flaw-patrol-db
    restart: unless-stopped
    env_file: flaw-patrol.env
    environment:
      - POSTGRES_USER=flawpatrol
      - POSTGRES_DB=flawpatrol
    # Reachable from outside on port 5444 (not Postgres's default 5432), for IT's tools
    # and backups. To allow only the server itself, use "127.0.0.1:5444:5432".
    ports:
      - "5444:5432"
    volumes:
      - flaw-patrol-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flawpatrol -d flawpatrol"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      database:

volumes:
  flaw-patrol-data:
    name: flaw-patrol-data

networks:
  # IT's nginx-proxy network, so the proxy can reach Flaw Patrol by its web name.
  default:
    name: nginx-proxy_default
    external: true
  # A private network just for Flaw Patrol and its database.
  database:
    name: flaw-patrol-database
