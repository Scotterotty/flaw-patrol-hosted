# Secrets come from Vault through the External Secrets Operator, never from a file in git.
# This makes a Kubernetes Secret named flaw-patrol-secrets that the app and the migrate
# step read as environment variables. Adjust the store name and Vault path to yours.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flaw-patrol-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault # your Vault ClusterSecretStore
  target:
    name: flaw-patrol-secrets
    creationPolicy: Owner
  data:
    # The app's database login: may read and write rows only (the "app" role).
    - secretKey: DATABASE_URL
      remoteRef: { key: flaw-patrol, property: DATABASE_URL }
    # The migrate step's login: may change tables (the "migrator" role). Used only by the Job.
    - secretKey: MIGRATE_DATABASE_URL
      remoteRef: { key: flaw-patrol, property: MIGRATE_DATABASE_URL }
    # Signs sign-in sessions. Changing it signs everyone out, nothing more.
    - secretKey: AUTH_SECRET
      remoteRef: { key: flaw-patrol, property: AUTH_SECRET }
    # Encrypts saved Jira, GitHub, Qase, TeamCity, Sentry and Slack tokens. Keep it forever:
    # changing it means pasting every saved token again.
    - secretKey: ENCRYPTION_KEY
      remoteRef: { key: flaw-patrol, property: ENCRYPTION_KEY }
    # Microsoft sign-in (Entra ID app registration). Set here, it works from the first
    # visit, before anyone has signed in. Redirect URI: https://<AUTH_URL host>/api/auth/callback/microsoft
    - secretKey: AUTH_MICROSOFT_TENANT_ID
      remoteRef: { key: flaw-patrol, property: AUTH_MICROSOFT_TENANT_ID }
    - secretKey: AUTH_MICROSOFT_ID
      remoteRef: { key: flaw-patrol, property: AUTH_MICROSOFT_ID }
    - secretKey: AUTH_MICROSOFT_SECRET
      remoteRef: { key: flaw-patrol, property: AUTH_MICROSOFT_SECRET }
