# `docker compose up` starts the database and the app at http://localhost:3000.
# For local trials only; see README for hosting.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testmgmt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    # Development-mode image for trying it out; the production image is Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/testmgmt
      AUTH_SECRET: local-trial-secret-change-me-for-anything-real
      AUTH_TRUST_HOST: "true"
      # Set to "true" to add a demo project (SHOP) with sample cases.
      SEED_DEMO: "false"
volumes:
  pgdata:
